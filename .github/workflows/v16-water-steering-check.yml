name: V16 Water Visibility Steering Check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  v16-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/v16-water-steering-check.mjs
      - run: node scripts/v15-character-check.mjs
      - run: node scripts/v14-audio-check.mjs
      - run: node scripts/package-smoke-check.mjs
